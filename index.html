<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Event Listner</title>
</head>

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: white;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    h1 {
        font-size: 42px;
        color: black;
    }

    button {
        font-size: 16px;
        padding: 10px;
        width: 20%;
        margin-bottom: 10px;
        cursor: pointer;
        background-color: gray;
        color: white;
        border: none;
        border-radius: 5px;
        transition: 0.3s;
    }

    button:hover {
        background-color: orange;
    }

    div {
        text-align: center;
        background-color: yellow;
        padding: 15px;
        width: 100%;
        margin-bottom: 10px;
    }

</style>

<body>
    <h1>Remove Event Listner</h1>

    <button id="alertButton">Show Alert</button>
    <button id="removeButton">Remove Alert</button>

<script src="script.js"></script>
</body>
</html>
